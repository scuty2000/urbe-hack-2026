services:
  api:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      API_QDRANT_URL: http://qdrant:6333
      API_DB_FILENAME: /data/lostfound.db
      API_STORAGE_DATA_DIR: /data
    volumes: ["./data:/data"]
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]
  tunnel:
    image: cloudflare/cloudflared:latest
    # Named tunnel: its public hostnames are configured in the Cloudflare
    # dashboard and routed to http://api:3000. The token stays in .env and is
    # passed to cloudflared as an environment variable (TUNNEL_TOKEN), never in
    # the committed command line.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [api]
    restart: unless-stopped
    profiles: ["tunnel"]
