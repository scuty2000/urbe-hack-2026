openapi: "3.1.0"

info:
  title: Fantastic Gin Dealcoholized API
  description: |
    RESTful API for the lost-and-found registry.

    Built with **Go** and **Gin**. All error responses share a consistent
    `{"error": "<message>"}` JSON shape.
  version: "1.0.0"
  contact:
    url: https://github.com/tommaso-sgroi/fantastic-gin-dealcoholized
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: "http://localhost:3000"
    description: Local development server

# Endpoints are public unless they declare a security requirement.
security: []

tags:
  - name: General
    description: Utility and diagnostic endpoints
  - name: Names
    description: CRUD operations on the `/names` resource
  - name: Auth
    description: Demo login, logout and current-session endpoints
  - name: Notifications
    description: Authenticated in-app inbox (own notifications only)
  - name: Timeline
    description: Safe custody-event timeline of an item
  - name: Items
    description: Item enrollment and custodian read endpoints
  - name: Claims
    description: Ownership claims, verification reports and custodian review
  - name: Passes
    description: Signed single-use pickup passes, QR validation and redemption
  - name: Fees
    description: PA custody fees and mock payments
  - name: Rewards
    description: Art. 930 reward notices settled outside the system
  - name: Chat
    description: Searcher conversational orchestrator (DeepSeek or mock fallback)
  - name: Custody
    description: Handover acceptance/refusal and custody deadlines
  - name: Institution
    description: PA pickup queue, transfer, official intake, review and unclaimed flow
  - name: Demo
    description: Deterministic demo dataset reset
  - name: Uploads
    description: Authenticated access to item photos

# ─────────────────────────────────────────────────────────────────────────────
paths:
  /healthz:
    get:
      tags: [General]
      operationId: liveness
      summary: Liveness probe
      description: |
        Returns `200` when the server is running and the database is reachable.
        Returns `500` otherwise. Use this with container orchestrators (Docker,
        Kubernetes) as a liveness check.
      responses:
        "200":
          description: Server is healthy
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /names ───────────────────────────────────────────────────────────────────

  /names:
    post:
      tags: [Names]
      operationId: createName
      summary: Create a name
      description: |
        Inserts a new name into the collection.
        Returns the created resource and a `Location` header pointing to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
            example:
              name: "Alice"
      responses:
        "201":
          description: Name successfully created
          headers:
            Location:
              description: URL of the newly created resource
              schema:
                type: string
                example: "/names/11"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 11
                name: "Alice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /names/{id} ──────────────────────────────────────────────────────────────

  /names/{id}:
    parameters:
      - $ref: "#/components/parameters/nameId"

    get:
      tags: [Names]
      operationId: getNameById
      summary: Get a name
      description: Returns the name resource identified by `id`.
      responses:
        "200":
          description: Name found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 1
                name: "Alice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Names]
      operationId: updateNameById
      summary: Update a name
      description: Replaces the `name` field of the resource identified by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
            example:
              name: "UpdatedAlice"
      responses:
        "200":
          description: Name successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 1
                name: "UpdatedAlice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Names]
      operationId: deleteNameById
      summary: Delete a name
      description: |
        Permanently removes the resource identified by `id`.
        Returns `204 No Content` on success with an empty body.
      responses:
        "204":
          description: Name deleted — no content returned
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /names/{id}/replace ──────────────────────────────────────────────────────

  /names/{id}/replace:
    parameters:
      - $ref: "#/components/parameters/nameId"

    post:
      tags: [Names]
      operationId: replaceName
      summary: Replace a name (transactional)
      description: |
        Atomically deletes the name identified by `id` and creates a new one
        with the provided value — both operations run inside a single database
        transaction. If any step fails the database is left unchanged.

        The response contains the **newly created** resource (with a new `id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
            example:
              name: "NewAlice"
      responses:
        "201":
          description: Name replaced — new resource returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 42
                name: "NewAlice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/auth ────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in as a demo user
      description: |
        Creates a server-side session for the given demo user id and sets the
        `lf_session` cookie (HttpOnly, SameSite=Lax, 12-hour lifetime). Login is
        by user id only in the demo MVP: there is no password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              userId: "finder-demo"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              description: Session cookie `lf_session`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: |
        Deletes the current session, if any, and expires the `lf_session`
        cookie. Idempotent: logging out without a session still returns `204`.
      responses:
        "204":
          description: Session deleted
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      description: Returns the user owning the `lf_session` cookie.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ─── /api/notifications ──────────────────────────────────────────────────────

  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List my notifications
      description: |
        Returns the authenticated user's own notifications, newest first, capped
        at 50. The payload contains only identifiers, statuses and amounts: the
        private profile, document fields, exact coordinates, tokens and expected
        verification values are never stored in a notification.

        Notification types: `match`, `custody_accepted`, `pickup_due`,
        `pass_issued`, `handover`, `transfer`, `sensitive`, `fee_paid`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The user's notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/notificationId"

    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification read
      description: |
        Marks one of the authenticated user's notifications as read. Another
        user's notification is `403`; an unknown id is `404`. The operation is
        idempotent.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/claims ──────────────────────────────────────────────────────────────

  /api/claims:
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Submit an ownership claim
      description: |
        Creates a claim for the authenticated searcher. The server builds the
        verification session from the item's discriminative attributes and the
        supplied answers, applies the deterministic policy and atomically
        records the claim, the verification session, the `claim_created` item
        event and the audit entry.

        A raw confidence is never accepted (unknown JSON fields are rejected).
        The policy auto-approves low/medium risk claims at or above `0.75`,
        keeps high-risk claims under review (review threshold `0.85`), always
        reviews sensitive items, and rejects claims carrying a prompt-injection
        or identity-mismatch flag. No pickup pass is issued here.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimPayload"
      responses:
        "201":
          description: Claim created
          headers:
            Location:
              schema:
                type: string
              description: Path of the created claim (`/api/claims/{id}`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimOwner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/claims/{id}:
    parameters:
      - $ref: "#/components/parameters/claimId"

    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get a claim
      description: |
        Returns a claim to its owner (the searcher who created it) or to the
        current custodian, the legal finder and the institution.

        The searcher receives only the status, the confidence band and the
        pickup channel. The custodian and the institution receive the full
        verification report (questions, answers, probabilities, rationale,
        model version, evidence, flags and the deterministic decision). The
        item's private profile is never returned.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The claim, in the role-safe shape
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ClaimOwner"
                  - $ref: "#/components/schemas/ClaimInstitution"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/passes ─────────────────────────────────────────────────────────────

  /api/passes:
    post:
      tags: [Passes]
      operationId: createPass
      summary: Issue a signed pickup pass
      description: |
        Issues a single-use pickup pass for an approved claim. The caller must
        be the searcher who owns the claim; the item must currently be
        `in_custody` (direct return) or `transferred` (PA return), and the claim
        channel must match the item state.

        The pass is signed with HMAC-SHA256 (`AUTH_PASS_SECRET`) and expires
        after `AUTH_PASS_TTL`. Only the SHA-256 hash of the token is stored. The
        raw token is returned exactly once, in this response, and must be
        rendered as a QR code by the client.

        A PA return with an unpaid fee yields a `pending_payment` pass: it is
        issued but cannot be validated or redeemed until the fee is paid. Once
        the fee is settled, validating or redeeming the same token transitions
        it to `issued` with a guarded status update. Direct returns before the
        transfer to the PA are free.

        If the signing secret is not configured the endpoint fails closed with
        `503`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePassPayload"
      responses:
        "201":
          description: Pass issued; the raw token is included only here
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
              description: The response contains a bearer token and must never be cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassIssueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: Pickup passes are not configured (missing secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/passes/validate:
    post:
      tags: [Passes]
      operationId: validatePass
      summary: Validate a scanned pickup token
      description: |
        Checks a scanned QR token for the authenticated intermediary or
        institution. The caller must be the current custodian of the item.

        An unusable pass is a normal scanner outcome, not a server error: the
        response is `200` with `valid: false` and one of the reasons
        `expired`, `wrong_custodian`, `unpaid`, `revoked`, `already_redeemed`,
        `item_not_in_custody`, `claim_not_approved` or `invalid_token`.
        The item summary is returned only when the pass is valid and never
        contains the private profile or exact coordinates.

        The raw token is never logged or echoed by the server.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassTokenPayload"
      responses:
        "200":
          description: Validation outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassValidation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Pickup passes are not configured (missing secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/passes/redeem:
    post:
      tags: [Passes]
      operationId: redeemPass
      summary: Redeem a pickup token
      description: |
        Validates the token and performs the handover atomically: the pass
        becomes `redeemed`, the item `returned` and the claim `handed_over`,
        with a `handover` custody event and an audit entry. The caller must be
        the current custodian.

        A second scan of the same token is `409 Conflict`; a scan at the wrong
        counter is `403 Forbidden`; an expired token is `400 Bad Request`; an
        unpaid PA pass is `409 Conflict`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassTokenPayload"
      responses:
        "200":
          description: Handover completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassRedemption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: Pickup passes are not configured (missing secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# ─── /api/items/{id}/fee ─────────────────────────────────────────────────────

  /api/items/{id}/fee:
    parameters:
      - $ref: "#/components/parameters/itemId"

    get:
      tags: [Fees]
      operationId: getItemFee
      summary: Estimate the item's pickup fee
      description: |
        Returns the current fee for the item to an authenticated searcher,
        intermediary or institution.

        A direct return before the item is transferred is free:
        `applies=none_direct_return` and `amountCents=0`. Once the item has been
        transferred, the active PA tariff applies: the custody time since
        `transferred_at` is rounded up to whole days (minimum 1) and multiplied
        by the daily rate, plus the fixed fee. The estimate is recalculated until
        it is paid; a paid fee is final.

        The response contains no private profile, notes or exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current fee estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/fees/{id}/pay ──────────────────────────────────────────────────────

  /api/fees/{id}/pay:
    parameters:
      - $ref: "#/components/parameters/feeId"

    post:
      tags: [Fees]
      operationId: payFee
      summary: Pay a PA fee with the mock provider
      description: |
        Settles a PA fee for the authenticated searcher who owns a claim on the
        item. The mock provider records a `paid` payment with `provider=mock`, a
        provider reference and a local receipt URL (`/receipts/{paymentId}`).
        No real payment keys are involved.

        A direct return is free and cannot be paid; an already settled fee cannot
        be paid twice. The searcher then validates or redeems the same pickup
        pass, which is unlocked from `pending_payment` to `issued`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Payment receipt
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/items/{id}/reward-notice ───────────────────────────────────────────

  /api/items/{id}/reward-notice:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Rewards]
      operationId: requestRewardNotice
      summary: Record the legal finder's reward request
      description: |
        Records the art. 930 reward requested by the item's legal finder. Only
        the intermediary who is the legal finder may call this route.

        The amount is optional. The platform never charges or pays the reward:
        `paymentStatus` is always `outside_system`, and the settlement happens
        between the parties outside the platform.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRewardNoticePayload"
      responses:
        "201":
          description: Reward notice recorded
          headers:
            Location:
              schema:
                type: string
                example: "/api/items/6a0f7f9e-0b9c-4d5a-9d6e-2f1a0c9b8e7d/reward-notice"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags: [Rewards]
      operationId: getRewardNotice
      summary: Read the item's reward notice
      description: |
        Returns the item's latest reward notice to an authenticated searcher,
        intermediary or institution. The first searcher read before pickup sets
        `shownToSearcherAt`; later reads preserve the original timestamp.

        The response contains no private profile data or exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Reward notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardNotice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/chat ───────────────────────────────────────────────────────────────

  /api/chat:
    post:
      tags: [Chat]
      operationId: postChat
      summary: Send one searcher chat turn
      description: |
        Runs one conversational turn for the authenticated searcher. The agent
        searches the registry, asks one open question at a time and, when the
        supplied details are sufficient, creates a claim through the claim
        service. The verification session is always built server-side: a
        confidence, a private profile or an approval sent by the client is
        rejected as an unknown field.

        The response carries only the assistant message, the public candidate
        summaries, the claim id (when a claim was created) and the terminal
        flag. Private profile values, exact coordinates, document fields and
        expected answers are never returned.

        When DeepSeek is not configured or unavailable, a deterministic mock
        agent answers instead. The route accepts at most 20 messages per
        searcher per minute; further requests receive `429`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              messages:
                - role: user
                  content: "ho perso un iphone in zona San Lorenzo"
      responses:
        "200":
          description: The role-safe assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Chat rate limit exceeded (20 messages per minute per searcher)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "too many chat messages, try again later"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/items ───────────────────────────────────────────────────────────────

  /api/items:
    post:
      tags: [Items]
      operationId: createItem
      summary: Enroll a found item
      description: |
        Enrolls a found item and records the explicit transfer of the finder's
        legal status to the intermediary (`rightsAssigned` must be `true`).
        The item, its custody row, the `rights_assigned` event and the audit
        entry are written in one transaction.

        The request is `multipart/form-data` with a JSON `payload` field and
        repeated `photos` file parts (JPEG, PNG or WebP).

        Source rules by role:
        * **finder** — `source=finder_self`; `intermediaryId` is required and
          becomes the legal finder.
        * **intermediary** — `source=finder_mediated`; the caller is finder,
          intermediary and legal finder.

        Official operator intake (`source=operator`, institution role) is
        intentionally not exposed here; it belongs to the PA intake flow.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/ItemPayload"
                photos:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Item enrolled
          headers:
            Location:
              description: URL of the newly created item
              schema:
                type: string
                example: "/api/items/6a0f7f9e-0b9c-4d5a-9d6e-2f1a0c9b8e7d"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: |
            Invalid multipart body, payload, photo, or a violated domain
            invariant (missing rights assignment, legal finder mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags: [Items]
      operationId: listMyItems
      summary: List the authenticated intermediary's items
      description: |
        Returns the items currently held by the caller, limited to the open
        statuses `pending_custody`, `in_custody`, `pickup_due` and
        `sensitive_pickup`. Only `custodian=me` is supported: an intermediary
        cannot browse the registry.
      security:
        - cookieAuth: []
      parameters:
        - name: custodian
          in: query
          required: true
          schema:
            type: string
            enum: [me]
      responses:
        "200":
          description: The caller's open items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/items/{id} ──────────────────────────────────────────────────────────

  /api/items/{id}:
    parameters:
      - $ref: "#/components/parameters/itemId"

    get:
      tags: [Items]
      operationId: getItem
      summary: Get an item
      description: |
        Returns an item to its current custodian, its legal finder or an
        institution operator. Finders receive the `POST /api/items` response
        instead; searchers never see items. The DTO omits the private profile
        and the exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/items/{id}/timeline ────────────────────────────────────────────────

  /api/items/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/itemId"

    get:
      tags: [Timeline]
      operationId: getItemTimeline
      summary: Get an item timeline
      description: |
        Returns the item's custody events in chronological order. Available to
        the finder and intermediary connected to the item, and to institution
        and admin operators; searchers receive `403`.

        The response exposes only the event type, actor (role or safe
        operational alias), timestamp, notes and an evidence reference. It never
        contains the private profile, document contents or exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The safe custody timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemTimeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/items/{id}/custody ─────────────────────────────────────────────────

  /api/items/{id}/custody/accept:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Custody]
      operationId: acceptCustody
      summary: Accept custody of an item
      description: |
        Acknowledges the handover for the authenticated intermediary. Only the
        legal finder may accept, and only while the item is `pending_custody`
        with rights already assigned and an open custody row.

        On success the item becomes `in_custody` and the legal deadline is
        stored: 7 days for ordinary items, 24 hours for sensitive ones. The
        acceptance event and the audit entry are written in the same
        transaction.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Custody accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/items/{id}/custody/refuse:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Custody]
      operationId: refuseCustody
      summary: Refuse custody of an item
      description: |
        Rejects the handover for the authenticated intermediary. The same
        preconditions as `accept` apply: the caller must be the legal finder,
        the item must be `pending_custody` with rights assigned and the custody
        row must still be open.

        On success the item becomes `custody_rejected`, the custody row is
        closed and the reason is recorded on the `custody_rejected` event and
        in the audit log.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefuseCustodyPayload"
      responses:
        "200":
          description: Custody refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/institution/tick ───────────────────────────────────────────────────

  /api/institution/tick:
    post:
      tags: [Institution]
      operationId: tickCustodyDeadlines
      summary: Apply elapsed custody deadlines
      description: |
        Demo replacement for a scheduled job, restricted to the `admin` role.
        Every `in_custody` item whose deadline is at or before now moves to
        `pickup_due`; sensitive items move to `sensitive_pickup`. Each item gets
        a `pickup_scheduled` event and an audit entry. The transition is
        idempotent: a second call returns `updated: 0` for already-transitioned
        items.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Items transitioned by this tick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/institution ────────────────────────────────────────────────────────

  /api/institution/pickups:
    get:
      tags: [Institution]
      operationId: listInstitutionPickups
      summary: List the PA pickup queue
      description: |
        Returns the items in `pickup_due` / `sensitive_pickup`, grouped by
        holding intermediary and zone. Sensitive groups and items come first,
        followed by the earliest deadline. Each item reports how many whole
        days it is overdue. The response never contains the private profile,
        free-text notes or exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pickup queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionPickupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/items:
    post:
      tags: [Institution]
      operationId: createOfficialItem
      summary: Official operator intake
      description: |
        Enrolls an item handed directly to the public administration. The
        institution is the source, the legal finder and the custodian; the item
        starts in `in_custody` with an accepted institution custody row, no
        7-day deadline and `legal_term_start` already set, so it can later follow
        the unclaimed offer flow. It uses the same multipart shape and
        catalog/risk path as `POST /api/items`, and is written atomically.
        Restricted to `institution` and `admin`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/OfficialItemPayload"
                photos:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Official item enrolled in institution custody
          headers:
            Location:
              description: URL of the newly created item
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/items/{id}/transfer:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Institution]
      operationId: transferCustodyToInstitution
      summary: Transfer an item to the institution
      description: |
        Takes an item in `pickup_due` / `sensitive_pickup` from its
        intermediary. The intermediary custody row is closed, a new institution
        custody row is opened without a deadline, and the item becomes
        `transferred` with `transferred_at` and `legal_term_start` set to now.
        Open pickup passes are revoked in the same transaction. The search index
        is refreshed best effort. Restricted to `institution` and `admin`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Item transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The item is not in a pickup-due status or has no open intermediary custody
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/items/{id}/offer:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Institution]
      operationId: offerUnclaimedItem
      summary: Offer an unclaimed item to the legal finder
      description: |
        Moves a `transferred`/`unclaimed` item, or an officially intaken
        institution `in_custody` item with a legal term, to
        `offered_to_finder` only after one year has elapsed since
        `legal_term_start`; an earlier request is `400`. Records the
        `offered_to_finder` event and audit entry.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Item offered to the legal finder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: The one-year legal term has not elapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/items/{id}/collect:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Institution]
      operationId: collectUnclaimedItem
      summary: Record collection by the legal finder
      description: |
        Moves an item from `offered_to_finder` to `finder_collected` and
        appends the `finder_collected` event and audit entry. Available only
        after the offer.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Item collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/items/{id}/dispose:
    parameters:
      - $ref: "#/components/parameters/itemId"

    post:
      tags: [Institution]
      operationId: disposeUnclaimedItem
      summary: Dispose of an offered item
      description: |
        Moves an item from `offered_to_finder` to `disposed` and stores
        `disposed_at`. Disposal before the offer is rejected: the legal finder
        has the first right to the item.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Item disposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/claims/{id}:
    parameters:
      - $ref: "#/components/parameters/claimId"

    get:
      tags: [Institution]
      operationId: getInstitutionClaim
      summary: Get the full verification report
      description: |
        Returns the claim and its verification report to the institution: the
        questions, the searcher answers, the D3 probabilities, evidence, flags,
        rationale, model version and the deterministic decision. It never
        contains the item private profile or exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Claim with verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInstitution"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/institution/claims/{id}/review:
    parameters:
      - $ref: "#/components/parameters/claimId"

    post:
      tags: [Institution]
      operationId: reviewInstitutionClaim
      summary: Review an ownership claim
      description: |
        Records the `approved` or `rejected` institution decision through the
        claim domain and returns the refreshed verification report. The claim
        must be `submitted`, `under_review` or `more_info`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewClaimPayload"
      responses:
        "200":
          description: Claim reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInstitution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/demo/reset ─────────────────────────────────────────────────────────

  /api/demo/reset:
    post:
      tags: [Demo]
      operationId: resetDemo
      summary: Reset the demo dataset
      description: |
        Replaces the registry data with the deterministic demo seed: six users,
        two intermediaries, the active PA tariff and the four demo items
        (`item-phone` in custody, `item-wallet` transferred, `item-umbrella`
        and `item-document` pending). Users and sessions are preserved, so the
        current admin session stays valid.

        The route is restricted to the `admin` role and requires the shared
        secret configured through `API_DEMO_RESET_SECRET`, either in the
        `X-Demo-Reset-Secret` header or in the JSON body as `{"secret":"..."}`.
      security:
        - cookieAuth: []
      parameters:
        - name: X-Demo-Reset-Secret
          in: header
          required: false
          description: Shared demo reset secret (alternative to the JSON body)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoResetRequest"
      responses:
        "200":
          description: Demo dataset reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an admin or supplied the wrong secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
        "503":
          description: Demo reset is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "demo reset is not configured"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/uploads/{filename} ─────────────────────────────────────────────────

  /api/uploads/{filename}:
    parameters:
      - $ref: "#/components/parameters/uploadFilename"

    get:
      tags: [Uploads]
      operationId: getUpload
      summary: Download an item photo
      description: |
        Serves a stored photo to authenticated finders, intermediaries and
        institutions. Searchers are forbidden. Filenames are generated UUIDs;
        path traversal is rejected by the storage adapter.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ─────────────────────────────────────────────────────────────────────────────
components:

  schemas:

    Name:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Auto-generated unique identifier
          example: 1
        name:
          type: string
          minLength: 1
          description: The stored name value
          example: "Alice"

    NameInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: The name to store. Must be non-empty.
          example: "Alice"

    LoginRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          minLength: 1
          description: Identifier of the demo user to log in as
          example: "finder-demo"

    User:
      type: object
      required:
        - id
        - role
        - name
        - email
      properties:
        id:
          type: string
          example: "finder-demo"
        role:
          type: string
          enum: [finder, searcher, intermediary, institution, admin]
          example: "finder"
        name:
          type: string
          example: "Giulia Ferrari"
        email:
          type: string
          format: email
          example: "finder-demo@example.test"
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      required:
        - id
        - type
        - payload
        - read
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - match
            - custody_accepted
            - pickup_due
            - pass_issued
            - handover
            - transfer
            - sensitive
            - fee_paid
        payload:
          type: object
          additionalProperties: true
          description: |
            Sanitised payload: identifiers, statuses and amounts only. It never
            contains the private profile, document fields, exact coordinates,
            tokens or expected verification values.
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"

    NotificationRead:
      type: object
      required:
        - id
        - read
      properties:
        id:
          type: string
          format: uuid
        read:
          type: boolean
          example: true

    TimelineEvent:
      type: object
      required:
        - id
        - type
        - actor
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Custody event type (e.g. rights_assigned, accepted, handover)
          example: "accepted"
        actor:
          type: string
          description: |
            Resolved actor role for user accounts (finder, searcher) or the safe
            operational alias (intermediary id, institution id, system).
          example: "intermediary"
        actorRole:
          type: string
          enum: [finder, searcher, intermediary, institution, admin]
        timestamp:
          type: string
          format: date-time
        notes:
          type: string
          description: Operational note without private profile data.
        evidenceRef:
          type: string
          description: Reference to evidence, never the evidence contents.

    ItemTimeline:
      type: object
      required:
        - itemId
        - events
      properties:
        itemId:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"

    ItemPayload:
      type: object
      required:
        - category
        - rightsAssigned
      properties:
        intermediaryId:
          type: string
          description: |
            Intermediary chosen by a finder. Required for the finder role and
            ignored for intermediaries.
          example: "bar-x"
        category:
          type: string
          description: Category suggested by the AI and confirmed by the user
          example: "smartphone"
        brand:
          type: string
          example: "Apple"
        model:
          type: string
          example: "iPhone 17"
        color:
          type: string
          example: "black"
        condition:
          type: string
          example: "good"
        privateProfile:
          type: object
          additionalProperties: true
          description: |
            Unique identifying details. Stored privately and never returned by
            any endpoint.
        foundAt:
          type: string
          format: date-time
        foundLat:
          type: number
          format: double
          description: Exact latitude. Stored privately, never returned.
        foundLng:
          type: number
          format: double
          description: Exact longitude. Stored privately, never returned.
        foundZone:
          type: string
          example: "San Lorenzo"
        foundNotes:
          type: string
        rightsAssigned:
          type: boolean
          description: |
            Explicit transfer of the finder's legal status to the intermediary.
            Enrollment is rejected unless this is `true`.
          example: true

    Item:
      type: object
      required:
        - id
        - publicCode
        - status
        - rightsAssigned
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          pattern: "^LF-[0-9A-F]{8}$"
          example: "LF-1A2B3C4D"
        source:
          type: string
          enum: [finder_self, finder_mediated, operator]
        custodyMode:
          type: string
          enum: [intermediary, institution]
        status:
          type: string
          enum: [enrolled, pending_custody, custody_rejected, in_custody, pickup_due, sensitive_pickup, transferred, unclaimed, offered_to_finder, finder_collected, disposed]
        legalFinderId:
          type: string
        custodianId:
          type: string
        category:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        condition:
          type: string
        photos:
          type: array
          items:
            type: string
            description: Authenticated URL under `/api/uploads/`
        foundAt:
          type: string
          format: date-time
        foundZone:
          type: string
        foundNotes:
          type: string
        riskTier:
          type: string
          enum: [low, medium, high, sensitive]
        sensitive:
          type: boolean
        rightsAssigned:
          type: boolean
        rightsAssignedAt:
          type: string
          format: date-time
        transferredAt:
          type: string
          format: date-time
        legalTermStart:
          type: string
          format: date-time
        offeredToFinderAt:
          type: string
          format: date-time
        disposedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    InstitutionPickupItem:
      type: object
      required: [id, publicCode, status, sensitive, daysOverdue]
      description: |
        Safe pickup-queue item summary. It contains no private profile, notes or
        exact coordinates.
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          pattern: "^LF-[0-9A-F]{8}$"
        category:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [pickup_due, sensitive_pickup]
        foundZone:
          type: string
        intermediaryId:
          type: string
        sensitive:
          type: boolean
        dueAt:
          type: string
          format: date-time
        daysOverdue:
          type: integer
          minimum: 0

    InstitutionPickupGroup:
      type: object
      required: [intermediaryId, zone, sensitive, count, items]
      properties:
        intermediaryId:
          type: string
        zone:
          type: string
        sensitive:
          type: boolean
          description: True when the group contains a sensitive item
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstitutionPickupItem"

    InstitutionPickupList:
      type: object
      required: [groups, total]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/InstitutionPickupGroup"
        total:
          type: integer
          minimum: 0

    OfficialItemPayload:
      type: object
      required: [category]
      description: |
        JSON payload of the official operator intake. The institution is always
        the source, the legal finder and the custodian; the caller cannot choose
        a different intermediary.
      properties:
        category:
          type: string
          example: "wallet"
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        condition:
          type: string
        privateProfile:
          type: object
          additionalProperties: true
          description: Stored privately and never returned by any endpoint.
        foundAt:
          type: string
          format: date-time
        foundLat:
          type: number
          format: double
          description: Stored privately, never returned.
        foundLng:
          type: number
          format: double
          description: Stored privately, never returned.
        foundZone:
          type: string
        foundNotes:
          type: string

    ReviewClaimPayload:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]

    CustodySummary:
      type: object
      required: [itemId, status, dueAt, maxCustodyDays, daysLeft]
      description: |
        The accepted handover and its legal deadline. It contains no private
        profile and no coordinates.
      properties:
        itemId:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_custody]
        custodianType:
          type: string
          enum: [intermediary, institution]
        custodianId:
          type: string
        legalFinderId:
          type: string
        maxCustodyDays:
          type: integer
          description: 7 for ordinary items, 1 for sensitive items
          example: 7
        acceptedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          description: 24 hours after acceptance for sensitive items
        daysLeft:
          type: integer
          description: Whole days remaining before the deadline, rounded up
          example: 7

    RefuseCustodyPayload:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          example: "storage is full"

    TickResult:
      type: object
      required: [updated, items]
      properties:
        updated:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    CreateClaimPayload:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string
          format: uuid
        returnChannel:
          type: string
          enum: [intermediary_direct, pa]
          description: |
            Optional. Must match the channel derived from the item state:
            `in_custody` requires `intermediary_direct`, `transferred` requires
            `pa`. A conflicting value is rejected with `400`.
        answers:
          type: object
          additionalProperties:
            type: string
          description: Searcher answers keyed by verification question.
        evidence:
          type: array
          items:
            type: string
          description: Optional evidence references (receipt, serial, photo).
        flags:
          type: array
          items:
            type: string
            enum: [prompt_injection, inconsistent_answers, missing_evidence, identity_mismatch]
          description: Agent or reviewer signals that can force review or reject.

    ClaimOwner:
      type: object
      required: [id, itemId, status, confidenceBand, returnChannel]
      description: |
        Searcher-safe claim view. It contains no raw confidence, no verification
        report, no private profile and no exact coordinates.
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitted, under_review, approved, rejected, more_info]
        confidenceBand:
          type: string
          enum: [low, medium, high]
        returnChannel:
          type: string
          enum: [intermediary_direct, pa]
        createdAt:
          type: string
          format: date-time

    VerificationReport:
      type: object
      description: |
        Full verification report for the custodian and the institution. It
        never contains the item's private profile values.
      properties:
        questions:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum: [choice, noul, score]
              criteria:
                description: Optional D3 criteria for the question
        answers:
          type: object
          additionalProperties:
            type: string
        probabilities:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
              noul:
                type: number
              score:
                type: number
              confidence:
                type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          type: string
        modelVersion:
          type: string
          example: "local"
        evidence:
          type: array
          items:
            type: string
        flags:
          type: array
          items:
            type: string
        decision:
          type: string
          enum: [auto_approve, review, reject, more_info]
        reasons:
          type: array
          items:
            type: string

    ClaimInstitution:
      allOf:
        - $ref: "#/components/schemas/ClaimOwner"
        - type: object
          properties:
            confidence:
              type: number
              minimum: 0
              maximum: 1
            report:
              $ref: "#/components/schemas/VerificationReport"

    CreatePassPayload:
      type: object
      required: [claimId]
      properties:
        claimId:
          type: string
          format: uuid
          description: Approved claim owned by the authenticated searcher.

    PassTokenPayload:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            The raw signed token embedded in the QR code. It is sent by the
            scanner and never logged by the server.

    PassItem:
      type: object
      description: |
        Safe item summary returned with a pass. It never contains the private
        profile, evidence, photos or exact coordinates.
      required: [id, publicCode, status, custodianId]
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          example: "LF-00000001"
        category:
          type: string
          example: "smartphone"
        brand:
          type: string
          example: "Apple"
        model:
          type: string
          example: "iPhone 17"
        color:
          type: string
          example: "nero"
        status:
          type: string
          enum: [in_custody, transferred, returned]
        custodianId:
          type: string
          example: "bar-x"

    PassIssueResponse:
      type: object
      required: [passId, claimId, itemId, token, status, returnChannel, expiresAt]
      properties:
        passId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        token:
          type: string
          description: |
            Raw signed token. Returned exactly once; render it as a QR code and
            do not store it in logs or analytics.
        status:
          type: string
          enum: [pending_payment, issued]
        returnChannel:
          type: string
          enum: [intermediary_direct, pa]
        expiresAt:
          type: string
          format: date-time
        instructions:
          type: array
          items:
            type: string
        item:
          $ref: "#/components/schemas/PassItem"

    PassValidation:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        reason:
          type: string
          enum:
            - invalid_token
            - expired
            - wrong_custodian
            - unpaid
            - revoked
            - already_redeemed
            - item_not_in_custody
            - claim_not_approved
        expiresAt:
          type: string
          format: date-time
          description: Present only when the pass is valid.
        item:
          $ref: "#/components/schemas/PassItem"

    PassRedemption:
      type: object
      required: [item, returnedAt]
      properties:
        item:
          $ref: "#/components/schemas/PassItem"
        returnedAt:
          type: string
          format: date-time

    Fee:
      type: object
      description: |
        Safe fee read model. It contains no item profile, exact location or
        payment secret.
      required: [id, itemId, applies, custodyDays, amountCents, currency, status, paid]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        applies:
          type: string
          enum: [none_direct_return, pa_tariff]
        custodyDays:
          type: integer
          minimum: 0
          description: Whole custody days billed; 0 for a direct return.
        amountCents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          example: "EUR"
        status:
          type: string
          enum: [estimated, final, paid, waived]
        paid:
          type: boolean
          description: True for a free direct return and for a settled PA fee.
        payment:
          $ref: "#/components/schemas/Payment"

    Payment:
      type: object
      description: |
        Mock-provider payment receipt. The provider reference and receipt URL are
        local; no real payment credential is involved.
      required: [id, feeId, provider, providerRef, status, receiptUrl]
      properties:
        id:
          type: string
          format: uuid
        feeId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [mock]
        providerRef:
          type: string
        status:
          type: string
          enum: [paid]
        paidAt:
          type: string
          format: date-time
        receiptUrl:
          type: string
          example: "/receipts/2f1a0c9b-8e7d-4d5a-9d6e-6a0f7f9e0b9c"

    CreateRewardNoticePayload:
      type: object
      description: |
        Optional reward request body. The amount is requested, never charged by
        the platform.
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 0

    RewardNotice:
      type: object
      description: |
        Art. 930 reward notice. It never contains the item's private profile or
        exact coordinates.
      required: [id, itemId, legalFinderId, requested, amountCents, paymentStatus]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        legalFinderId:
          type: string
          example: "bar-x"
        requested:
          type: boolean
        amountCents:
          type: integer
          format: int64
          minimum: 0
        shownToSearcherAt:
          type: string
          format: date-time
          description: Set on the first searcher read before pickup.
        paymentStatus:
          type: string
          enum: [outside_system]

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: |
            Only user and assistant turns are accepted. A client-supplied
            system message is rejected (400) so the system prompt cannot be
            overridden.
        content:
          type: string
          minLength: 1

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChatMessage"

    ChatCandidate:
      type: object
      description: Public, role-safe candidate summary. No private data.
      required: [itemId, score, category, foundZone, foundAt, custodianType]
      properties:
        itemId:
          type: string
          example: "item-phone"
        score:
          type: number
          minimum: 0
          maximum: 1
        category:
          type: string
          example: "smartphone"
        foundZone:
          type: string
          example: "San Lorenzo"
        foundAt:
          type: string
          format: date-time
        custodianType:
          type: string
          enum: [intermediary, institution]

    ChatResponse:
      type: object
      required: [message, candidates, claimId, done]
      properties:
        message:
          type: string
          description: |
            Assistant message. It never contains private profile values, exact
            coordinates, document fields or expected answers.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ChatCandidate"
        claimId:
          type: string
          description: Claim created by this turn, or an empty string.
        done:
          type: boolean
          description: True when a claim was created or the case was escalated.

    DemoResetRequest:
      type: object
      properties:
        secret:
          type: string
          description: Shared secret; the X-Demo-Reset-Secret header wins if present.
          example: "change-me"

    DemoResetResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reset]

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable description of the error
          example: "not found"

  parameters:

    nameId:
      name: id
      in: path
      required: true
      description: Numeric identifier of the name resource
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    itemId:
      name: id
      in: path
      required: true
      description: UUID of the item
      schema:
        type: string
        format: uuid

    uploadFilename:
      name: filename
      in: path
      required: true
      description: Generated UUID filename of a stored photo
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]+\\.(jpg|png|webp)$"

    claimId:
      name: id
      in: path
      required: true
      description: UUID of the claim
      schema:
        type: string
        format: uuid

    feeId:
      name: id
      in: path
      required: true
      description: UUID of the fee
      schema:
        type: string
        format: uuid

    notificationId:
      name: id
      in: path
      required: true
      description: UUID of the notification
      schema:
        type: string
        format: uuid

  responses:

    BadRequest:
      description: |
        The request is malformed — e.g. `id` is not a number, or the JSON body
        is missing / has an empty `name` field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidId:
              summary: Non-numeric ID in path
              value:
                error: "invalid id"
            missingName:
              summary: Missing or empty name in body
              value:
                error: "body must be JSON with a non-empty \"name\" field"

    NotFound:
      description: No resource exists with the given `id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "not found"

    Unauthorized:
      description: |
        Authentication is missing or invalid — for login, the user id is unknown;
        for `/api/auth/me`, the session cookie is missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "unknown user"

    Forbidden:
      description: |
        The caller is authenticated but not allowed to perform this operation,
        for example a searcher reading an item or an upload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "forbidden"

    Conflict:
      description: |
        The item is not in a state that allows the transition — for example it
        is already `in_custody`, has no open custody row or has no rights
        assignment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "item is not pending custody"

    InternalServerError:
      description: An unexpected server-side error occurred. Check server logs for details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            generic:
              summary: Generic server error
              value:
                error: "internal server error"
            dbUnreachable:
              summary: Database unreachable (liveness probe)
              value:
                error: "database unreachable"

  securitySchemes:

    cookieAuth:
      type: apiKey
      in: cookie
      name: lf_session
      description: |
        Server-side session cookie set by `POST /api/auth/login`. Stores a random
        token; only its SHA-256 hash is persisted in the database.
