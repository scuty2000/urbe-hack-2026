openapi: "3.1.0"

info:
  title: Fantastic Gin Dealcoholized API
  description: |
    RESTful API for the lost-and-found registry.

    Built with **Go** and **Gin**. All error responses share a consistent
    `{"error": "<message>"}` JSON shape.
  version: "1.0.0"
  contact:
    url: https://github.com/tommaso-sgroi/fantastic-gin-dealcoholized
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: "http://localhost:3000"
    description: Local development server

# Endpoints are public unless they declare a security requirement.
security: []

tags:
  - name: General
    description: Utility and diagnostic endpoints
  - name: Names
    description: CRUD operations on the `/names` resource
  - name: Auth
    description: Demo login, logout and current-session endpoints
  - name: Items
    description: Item enrollment and custodian read endpoints
  - name: Uploads
    description: Authenticated access to item photos

# ─────────────────────────────────────────────────────────────────────────────
paths:
  /healthz:
    get:
      tags: [General]
      operationId: liveness
      summary: Liveness probe
      description: |
        Returns `200` when the server is running and the database is reachable.
        Returns `500` otherwise. Use this with container orchestrators (Docker,
        Kubernetes) as a liveness check.
      responses:
        "200":
          description: Server is healthy
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /names ───────────────────────────────────────────────────────────────────

  /names:
    post:
      tags: [Names]
      operationId: createName
      summary: Create a name
      description: |
        Inserts a new name into the collection.
        Returns the created resource and a `Location` header pointing to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
            example:
              name: "Alice"
      responses:
        "201":
          description: Name successfully created
          headers:
            Location:
              description: URL of the newly created resource
              schema:
                type: string
                example: "/names/11"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 11
                name: "Alice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /names/{id} ──────────────────────────────────────────────────────────────

  /names/{id}:
    parameters:
      - $ref: "#/components/parameters/nameId"

    get:
      tags: [Names]
      operationId: getNameById
      summary: Get a name
      description: Returns the name resource identified by `id`.
      responses:
        "200":
          description: Name found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 1
                name: "Alice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Names]
      operationId: updateNameById
      summary: Update a name
      description: Replaces the `name` field of the resource identified by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
            example:
              name: "UpdatedAlice"
      responses:
        "200":
          description: Name successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 1
                name: "UpdatedAlice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Names]
      operationId: deleteNameById
      summary: Delete a name
      description: |
        Permanently removes the resource identified by `id`.
        Returns `204 No Content` on success with an empty body.
      responses:
        "204":
          description: Name deleted — no content returned
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /names/{id}/replace ──────────────────────────────────────────────────────

  /names/{id}/replace:
    parameters:
      - $ref: "#/components/parameters/nameId"

    post:
      tags: [Names]
      operationId: replaceName
      summary: Replace a name (transactional)
      description: |
        Atomically deletes the name identified by `id` and creates a new one
        with the provided value — both operations run inside a single database
        transaction. If any step fails the database is left unchanged.

        The response contains the **newly created** resource (with a new `id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
            example:
              name: "NewAlice"
      responses:
        "201":
          description: Name replaced — new resource returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Name"
              example:
                id: 42
                name: "NewAlice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/auth ────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in as a demo user
      description: |
        Creates a server-side session for the given demo user id and sets the
        `lf_session` cookie (HttpOnly, SameSite=Lax, 12-hour lifetime). Login is
        by user id only in the demo MVP: there is no password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              userId: "finder-demo"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              description: Session cookie `lf_session`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: |
        Deletes the current session, if any, and expires the `lf_session`
        cookie. Idempotent: logging out without a session still returns `204`.
      responses:
        "204":
          description: Session deleted
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      description: Returns the user owning the `lf_session` cookie.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ─── /api/items ───────────────────────────────────────────────────────────────

  /api/items:
    post:
      tags: [Items]
      operationId: createItem
      summary: Enroll a found item
      description: |
        Enrolls a found item and records the explicit transfer of the finder's
        legal status to the intermediary (`rightsAssigned` must be `true`).
        The item, its custody row, the `rights_assigned` event and the audit
        entry are written in one transaction.

        The request is `multipart/form-data` with a JSON `payload` field and
        repeated `photos` file parts (JPEG, PNG or WebP).

        Source rules by role:
        * **finder** — `source=finder_self`; `intermediaryId` is required and
          becomes the legal finder.
        * **intermediary** — `source=finder_mediated`; the caller is finder,
          intermediary and legal finder.

        Official operator intake (`source=operator`, institution role) is
        intentionally not exposed here; it belongs to the PA intake flow.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/ItemPayload"
                photos:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Item enrolled
          headers:
            Location:
              description: URL of the newly created item
              schema:
                type: string
                example: "/api/items/6a0f7f9e-0b9c-4d5a-9d6e-2f1a0c9b8e7d"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: |
            Invalid multipart body, payload, photo, or a violated domain
            invariant (missing rights assignment, legal finder mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags: [Items]
      operationId: listMyItems
      summary: List the authenticated intermediary's items
      description: |
        Returns the items currently held by the caller, limited to the open
        statuses `pending_custody` and `in_custody`. Only `custodian=me` is
        supported: an intermediary cannot browse the registry.
      security:
        - cookieAuth: []
      parameters:
        - name: custodian
          in: query
          required: true
          schema:
            type: string
            enum: [me]
      responses:
        "200":
          description: The caller's open items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/items/{id} ──────────────────────────────────────────────────────────

  /api/items/{id}:
    parameters:
      - $ref: "#/components/parameters/itemId"

    get:
      tags: [Items]
      operationId: getItem
      summary: Get an item
      description: |
        Returns an item to its current custodian, its legal finder or an
        institution operator. Finders receive the `POST /api/items` response
        instead; searchers never see items. The DTO omits the private profile
        and the exact coordinates.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─── /api/uploads/{filename} ─────────────────────────────────────────────────

  /api/uploads/{filename}:
    parameters:
      - $ref: "#/components/parameters/uploadFilename"

    get:
      tags: [Uploads]
      operationId: getUpload
      summary: Download an item photo
      description: |
        Serves a stored photo to authenticated finders, intermediaries and
        institutions. Searchers are forbidden. Filenames are generated UUIDs;
        path traversal is rejected by the storage adapter.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ─────────────────────────────────────────────────────────────────────────────
components:

  schemas:

    Name:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Auto-generated unique identifier
          example: 1
        name:
          type: string
          minLength: 1
          description: The stored name value
          example: "Alice"

    NameInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: The name to store. Must be non-empty.
          example: "Alice"

    LoginRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          minLength: 1
          description: Identifier of the demo user to log in as
          example: "finder-demo"

    User:
      type: object
      required:
        - id
        - role
        - name
        - email
      properties:
        id:
          type: string
          example: "finder-demo"
        role:
          type: string
          enum: [finder, searcher, intermediary, institution, admin]
          example: "finder"
        name:
          type: string
          example: "Giulia Ferrari"
        email:
          type: string
          format: email
          example: "finder-demo@example.test"
        createdAt:
          type: string
          format: date-time

    ItemPayload:
      type: object
      required:
        - category
        - rightsAssigned
      properties:
        intermediaryId:
          type: string
          description: |
            Intermediary chosen by a finder. Required for the finder role and
            ignored for intermediaries.
          example: "bar-x"
        category:
          type: string
          description: Category suggested by the AI and confirmed by the user
          example: "smartphone"
        brand:
          type: string
          example: "Apple"
        model:
          type: string
          example: "iPhone 17"
        color:
          type: string
          example: "black"
        condition:
          type: string
          example: "good"
        privateProfile:
          type: object
          additionalProperties: true
          description: |
            Unique identifying details. Stored privately and never returned by
            any endpoint.
        foundAt:
          type: string
          format: date-time
        foundLat:
          type: number
          format: double
          description: Exact latitude. Stored privately, never returned.
        foundLng:
          type: number
          format: double
          description: Exact longitude. Stored privately, never returned.
        foundZone:
          type: string
          example: "San Lorenzo"
        foundNotes:
          type: string
        rightsAssigned:
          type: boolean
          description: |
            Explicit transfer of the finder's legal status to the intermediary.
            Enrollment is rejected unless this is `true`.
          example: true

    Item:
      type: object
      required:
        - id
        - publicCode
        - status
        - rightsAssigned
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          pattern: "^LF-[0-9A-F]{8}$"
          example: "LF-1A2B3C4D"
        source:
          type: string
          enum: [finder_self, finder_mediated, operator]
        custodyMode:
          type: string
          enum: [intermediary, institution]
        status:
          type: string
          enum: [enrolled, pending_custody, custody_rejected, in_custody]
        legalFinderId:
          type: string
        custodianId:
          type: string
        category:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        condition:
          type: string
        photos:
          type: array
          items:
            type: string
            description: Authenticated URL under `/api/uploads/`
        foundAt:
          type: string
          format: date-time
        foundZone:
          type: string
        foundNotes:
          type: string
        riskTier:
          type: string
          enum: [low, medium, high, sensitive]
        sensitive:
          type: boolean
        rightsAssigned:
          type: boolean
        rightsAssignedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable description of the error
          example: "not found"

  parameters:

    nameId:
      name: id
      in: path
      required: true
      description: Numeric identifier of the name resource
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    itemId:
      name: id
      in: path
      required: true
      description: UUID of the item
      schema:
        type: string
        format: uuid

    uploadFilename:
      name: filename
      in: path
      required: true
      description: Generated UUID filename of a stored photo
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]+\\.(jpg|png|webp)$"

  responses:

    BadRequest:
      description: |
        The request is malformed — e.g. `id` is not a number, or the JSON body
        is missing / has an empty `name` field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidId:
              summary: Non-numeric ID in path
              value:
                error: "invalid id"
            missingName:
              summary: Missing or empty name in body
              value:
                error: "body must be JSON with a non-empty \"name\" field"

    NotFound:
      description: No resource exists with the given `id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "not found"

    Unauthorized:
      description: |
        Authentication is missing or invalid — for login, the user id is unknown;
        for `/api/auth/me`, the session cookie is missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "unknown user"

    Forbidden:
      description: |
        The caller is authenticated but not allowed to perform this operation,
        for example a searcher reading an item or an upload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "forbidden"

    InternalServerError:
      description: An unexpected server-side error occurred. Check server logs for details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            generic:
              summary: Generic server error
              value:
                error: "internal server error"
            dbUnreachable:
              summary: Database unreachable (liveness probe)
              value:
                error: "database unreachable"

  securitySchemes:

    cookieAuth:
      type: apiKey
      in: cookie
      name: lf_session
      description: |
        Server-side session cookie set by `POST /api/auth/login`. Stores a random
        token; only its SHA-256 hash is persisted in the database.
