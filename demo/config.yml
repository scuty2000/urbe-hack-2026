config:
  path: ""                      # override with -c <path> or API_CONFIG_PATH=<path>

web:
  apihost: 0.0.0.0:3000         # API server bind address
  debughost: 0.0.0.0:4000       # pprof debug server
  readtimeout: 10s               # max time to read a full request
  writetimeout: 60s              # max time to write a full response
  shutdowntimeout: 10s           # graceful shutdown deadline
  trustedproxies: []            # e.g. [127.0.0.1, 10.0.0.0/8]

logger:
  level: info                   # debug | info | warn | error
  file: stdout                  # stderr | stdout | /path/to/file

db:
  filename: db/lostfound.db     # SQLite file path
